# ============================================================================
# Nginx — reverse proxy pour « J'ai ma nounou » (jaimanounou.com)
# L'app tourne en Docker sur le VPS, en local sur 127.0.0.1:3003.
# (melodie-web occupe déjà 3001, 3002 était pris ; on prend donc 3003 pour ce site.)
#
# 1) Copier ce fichier en : /etc/nginx/sites-available/jaimanounou.com.conf
# 2) L'activer : ln -s /etc/nginx/sites-available/jaimanounou.com.conf /etc/nginx/sites-enabled/
# 3) Tester : nginx -t   puis   systemctl reload nginx
# 4) HTTPS : certbot --nginx -d jaimanounou.com -d www.jaimanounou.com
#    (Certbot ajoute automatiquement le bloc 443 + la redirection HTTP->HTTPS)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name jaimanounou.com www.jaimanounou.com;

    # Marge pour l'upload de photos de profil
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        # Tampons agrandis : les cookies de session Supabase (jetons JWT) sont
        # volumineux, sinon Nginx renvoie un 502 « upstream sent too big header »
        # sur /auth/callback.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Support WebSocket (Supabase Realtime passe côté client, mais on reste large)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
