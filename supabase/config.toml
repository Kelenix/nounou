# Configuration Supabase locale (Docker). Voir https://supabase.com/docs/guides/cli/config
project_id = "jai-ma-nounou"

# Ports décalés (54331+) pour cohabiter avec une autre stack Supabase locale.
[api]
enabled = true
port = 54331
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54339
major_version = 15

[studio]
enabled = true
port = 54333

[local_smtp]
enabled = true
port = 54334

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001", "http://127.0.0.1:3000", "http://127.0.0.1:3001"]
jwt_expiry = 3600
enable_signup = true

# --- Limitation de débit (S5) : plafonds anti-abus. En production, vérifier aussi
#     les limites côté tableau de bord Supabase (Auth > Rate Limits). ---
[auth.rate_limit]
sms_sent = 30              # SMS OTP envoyés par heure (par IP)
sign_in_sign_ups = 30      # tentatives de connexion/inscription / 5 min / IP
token_verifications = 30   # vérifications d'OTP / 5 min / IP

# --- Authentification par téléphone + OTP ---
[auth.sms]
enable_signup = true
enable_confirmations = true
# En local : provider Twilio factice (jamais appelé) pour ACTIVER le login téléphone,
# combiné aux OTP de test ci-dessous qui court-circuitent tout envoi réel.
[auth.sms.twilio]
enabled = true
account_sid = "ACdev0000000000000000000000000000"
message_service_sid = "MGdev0000000000000000000000000000"
auth_token = "dev-local-dummy-token"
# Numéros de test (sans le +) → code fixe. Ajoutez-en pour tester d'autres numéros.
[auth.sms.test_otp]
2250700000001 = "123456"
2250700000002 = "123456"
2250700000003 = "123456"
2250700000004 = "123456"
2250700000005 = "123456"
2250700000006 = "123456"
2250700000007 = "123456"
2250700000098 = "123456"
2250700000099 = "123456"

# --- Authentification Google (OAuth) ---
# Renseignez GOOGLE_CLIENT_ID / GOOGLE_SECRET dans .env.local (local) ou dans le
# tableau de bord Supabase (Auth > Providers > Google) en production.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
